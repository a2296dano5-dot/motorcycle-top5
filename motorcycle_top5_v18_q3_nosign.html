{title:'直線七秒', short:'直線7秒', q:'直線平衡駕駛的「7秒」，怎樣才算符合要求？', options:['前輪進入計時感應區，到前輪離開計時區，達 7 秒以上，且腳不著地、車輪不壓管','只要騎得很慢即可，中途腳著地沒關係','只要後輪離開感應區前滿 7 秒即可'], answer:0, explain:'依本站提醒，從前輪進入計時感應區開始，到前輪離開計時區為止，須達 7 秒以上；同時保持平衡，不壓管、不落腳。', warning:'直線平衡時間不足 7 秒、車輪壓管線或腳著地，依對應評分項目各扣 32 分。'},

  }
  // simple request：不傳 Cookie、不建立使用者識別碼，不傳選項及個資。
  // no-cors 只能發送，無法從瀏覽器確認後台是否寫入成功。
  try {
    fetch(ANALYTICS_ENDPOINT,{method:'POST',mode:'no-cors',credentials:'omit',keepalive:true,
      headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).catch(()=>{});
  } catch(e){}
}

function paintStages(active=-1){return `<div class="stage-grid">${quiz.map((q,i)=>`<div class="stage-tile ${answers[i]!==undefined?'done':''} ${active===i?'current':''}"><div class="stage-icon">${faces[i]}</div><div class="stage-name">${q.short}</div></div>`).join('')}</div>`}
function render(){
  if(stage==='intro'){
    app.innerHTML=`<div class="kicker">🎮 五大魔王 · 1 次挑戰</div><div class="intro-bubble"><div class="eyebrow">準備好了嗎？</div><h2>5 關路考陷阱，你能全破解嗎？</h2><p>看考場示意圖、選正確操作、立刻學會避免失分！每關只有一題，考前快速複習。</p></div><h3 style="margin:0">🗺️ 五關挑戰地圖</h3>${paintStages()}<div class="note">✅ 立即揭曉答案與失分解析<br>🔒 不用登入，僅記錄匿名使用事件（啟用後）</div><button id="start" class="primary">🚀 開始挑戰五大魔王</button><p class="helper">可重複挑戰。五關順序為指定宣導主題，並非經統計驗證的實際扣分名次。</p>`;
    document.getElementById('start').onclick=()=>{stage='quiz';index=0;answers=[];track('quiz_start');render()};return;
  }
  if(stage==='quiz'){
    const q=quiz[index],chosen=answers[index];
    app.innerHTML=`<div class="head-row"><span>關卡 ${index+1} / 5</span><span>已破解 ${answers.filter(v=>v!==undefined).length} 關</span></div><div class="track"><div class="track-fill" style="width:${(index+1)*20}%"></div></div><div class="level"><div class="level-number">${index+1}</div><div><div class="level-title">${q.title}</div><div class="level-sub">大魔王挑戰 · 看圖選出正確操作</div></div></div>${art(index)}<h2 class="question">❓ ${q.q}</h2><div>${q.options.map((o,j)=>`<button type="button" class="option ${chosen!==undefined?(j===q.answer?'good':j===chosen?'bad':'faded'):''}" data-choice="${j}" ${chosen!==undefined?'disabled':''}><span class="letter">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}</div>${chosen!==undefined?`<section class="feedback ${chosen!==q.answer?'bad':''}" aria-live="polite"><div class="feedback-title">${chosen===q.answer?'🎉 漂亮！成功破解':'⚠️ 差一點！記住這招'}</div><div class="feedback-text">${q.explain}</div><div class="warning">📌 失分提醒：${q.warning}</div></section>`:''}<div class="actions"><button id="back" class="secondary" ${index===0?'disabled':''}>上一關</button><button id="next" class="primary" ${chosen===undefined?'disabled':''}>${index===4?'🏆 查看成果':'下一關 →'}</button></div>`;
    app.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{if(answers[index]!==undefined)return;const selected=Number(btn.dataset.choice);answers[index]=selected;track('question_answer',{question:index+1,correct:selected===q.answer});render()});
    document.getElementById('back').onclick=()=>{if(index>0){index--;render()}};
    document.getElementById('next').onclick=()=>{if(answers[index]===undefined)return;if(index===quiz.length-1){stage='done';const score=quiz.reduce((s,q,i)=>s+(answers[i]===q.answer?1:0),0);track('quiz_complete',{score,total:5});}else{index++;}render();window.scrollTo({top:0,behavior:'smooth'})};return;
  }
  const score=quiz.reduce((s,q,i)=>s+(answers[i]===q.answer?1:0),0);
  const stars=score===5?3:score>=3?2:1;
  const missed=quiz.map((q,i)=>({q,i})).filter(o=>answers[o.i]!==o.q.answer);
  const heading=score===5?'五大魔王全數破解！':score>=3?'闖關成功，繼續精進！':'完成挑戰，再練就更穩！';
  app.innerHTML=`<div class="result-top"><div class="trophy">${score===5?'🏆':'🎖️'}</div><div class="eyebrow">挑戰完成</div><div class="score">${score} / 5</div><div class="stars" aria-label="${stars}顆星">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h2>${heading}</h2><p>${score===5?'五關全對！仍要記得實際路考時安全操作。':'別擔心，下面已整理需要再複習的失分提醒。'}</p></div><h3 class="review-title">📋 五關破解紀錄</h3>${quiz.map((q,i)=>`<div class="review-card"><span class="review-check">${answers[i]===q.answer?'✅':'📌'}</span><div><strong>${q.title} · ${answers[i]===q.answer?'答對':'需要複習'}</strong><p>${answers[i]===q.answer?'記得實際考試仍須確實操作。':q.explain}</p></div></div>`).join('')}<div class="result-actions"><button class="primary" id="restart">🔄 再挑戰一次</button><button class="secondary" id="copy-result">📋 複製闖關成績</button></div><div class="note" style="margin-top:18px">本測驗僅供考前提醒，不等於正式路考成績或資格認定。</div>`;
  document.getElementById('restart').onclick=()=>{track('quiz_restart');stage='intro';index=0;answers=[];render();window.scrollTo({top:0,behavior:'smooth'})};
  document.getElementById('copy-result').onclick=async()=>{const msg=`我完成了「基隆監理站 機車路考大魔王 TOP 5」挑戰，答對 ${score}/5 題！`;try{await navigator.clipboard.writeText(msg);document.getElementById('copy-result').textContent='✅ 已複製成績';}catch(e){const ta=document.createElement('textarea');ta.value=msg;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();document.getElementById('copy-result').textContent='✅ 已複製成績';}track('result_copy');};
}
track('page_view');
render();
</script></body></html>
